name: CI/CD Pipeline - Validación de Software

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  MAVEN_OPTS: -Xmx1024m

jobs:
  # ===== QUALITY GATES =====
  code-quality:
    name: 🔍 Quality Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'adopt'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        
    - name: Run SpotBugs Analysis
      run: mvn compile spotbugs:check
      
    - name: Generate Quality Report
      run: mvn site:site
      
  # ===== UNIT TESTS =====
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'adopt'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        
    - name: Run Unit Tests
      run: mvn clean test
      
    - name: Generate Test Report
      run: mvn surefire-report:report
      
    - name: Code Coverage
      run: mvn jacoco:report
      
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./target/site/jacoco/jacoco.xml
        flags: unittests
        
  # ===== INTEGRATION TESTS =====  
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'adopt'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        
    - name: Run Integration Tests
      run: mvn verify -P integration-tests
      
  # ===== SECURITY SCAN =====
  security-scan:
    name: 🛡️ Security Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Run Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'biblioteca-system'
        path: '.'
        format: 'HTML'
        
  # ===== BUILD AND PACKAGE =====
  build:
    name: 🏗️ Build & Package
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, code-quality]
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'adopt'
        
    - name: Build Application
      run: mvn clean package -DskipTests
      
    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: biblioteca-jar
        path: target/*.jar
        
  # ===== PERFORMANCE TESTS =====
  performance-tests:
    name: ⚡ Performance Tests  
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Download Build Artifacts
      uses: actions/download-artifact@v3
      with:
        name: biblioteca-jar
        path: target/
        
    - name: Run Performance Tests
      run: |
        # Simulate load testing
        echo "Running performance benchmarks..."
        time java -cp target/*.jar Principal.Ejecutable
        
  # ===== DEPLOY TO STAGING =====
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, performance-tests, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
    - name: Deploy to Staging
      run: |
        echo "Deploying to staging environment..."
        echo "Application URL: https://staging-biblioteca.example.com"
        
  # ===== SMOKE TESTS =====
  smoke-tests:
    name: 💨 Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    steps:
    - name: Run Smoke Tests
      run: |
        echo "Running smoke tests against staging..."
        # curl -f https://staging-biblioteca.example.com/health || exit 1
        
  # ===== DEPLOY TO PRODUCTION =====
  deploy-production:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - name: Deploy to Production
      run: |
        echo "Deploying to production environment..."
        echo "Application URL: https://biblioteca.example.com"
        
  # ===== NOTIFICATIONS =====
  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    steps:
    - name: Notify Team
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Pipeline completed successfully!"
        else
          echo "❌ Pipeline failed. Check logs for details."
        fi